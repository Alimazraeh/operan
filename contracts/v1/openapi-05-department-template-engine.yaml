openapi: "3.0.3"
info:
  title: Operan Module 05 — Department Template Engine API
  description: >
    Manages department templates that define agent compositions, workflows,
    memory topologies, governance rules, KPIs, integrations, and operational
    policies for enterprise departments. Supports templating, versioning,
    custom template creation, and structured deployment flows.
  version: "1.0.0"
  contact:
    name: Operan Platform Team
  license:
    name: Proprietary

servers:
  - url: https://api.operan.io/v1
    description: Production
  - url: https://staging-api.operan.io/v1
    description: Staging

security:
  - BearerAuth: []
  - TenantHeader: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID

  schemas:
    Department:
      type: object
      description: Deployed department instance. Canonical field-level schema in contracts/v1/schema-05-department-template-engine.json#/definitions/Department.
      additionalProperties: true
    OrgChart:
      type: object
      properties:
        root_position_id:
          type: string
        positions:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              type:
                type: string
                enum: [reports_to, escalates_to]
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
    # ─── Core types ───
    Error:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: "An absolute URI that identifies the problem type. Defaults to 'about:blank'."
          default: "about:blank"
        title:
          type: string
          description: "A short, human-readable summary of the problem type."
        status:
          type: integer
          description: "The HTTP status code generated by the origin server for this occurrence of the problem."
        detail:
          type: string
          description: "A human-readable explanation specific to this occurrence of the problem."
        instance:
          type: string
          format: uri
          description: "An absolute URI that identifies the specific occurrence of the problem."
        request_id:
          type: string
          format: uuid
          description: "Correlation ID for request tracing."
      additionalProperties: false

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
      required: [total, page, page_size, has_more]

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, meta]

    # ─── Agent definition ───
    AgentDefinition:
      type: object
      required: [id, role, capabilities]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          description: Agent role within the department (e.g., 'analyst', 'coordinator')
        name:
          type: string
          maxLength: 200
        capabilities:
          type: array
          items:
            type: string
        model:
          type: string
        system_prompt:
          type: string
        memory_profile:
          type: string
        tool_requirements:
          type: array
          items:
            type: string
        constraints:
          type: object
          additionalProperties: true
        access_control:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Workflow definition ───
    WorkflowDefinition:
      type: object
      required: [id, name, steps]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        triggers:
          type: array
          items:
            type: string
        error_handling:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    WorkflowStep:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [agent_call, api_call, data_fetch, transformation, approval, notification, tool_call, conditional]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        timeout_seconds:
          type: integer
        retry_policy:
          type: object
          additionalProperties: true
      additionalProperties: false

    # ─── Memory topology ───
    MemoryTopology:
      type: object
      properties:
        semantic_enabled:
          type: boolean
          default: true
        episodic_enabled:
          type: boolean
          default: true
        procedural_enabled:
          type: boolean
          default: true
        graph_enabled:
          type: boolean
          default: true
        memory_profiles:
          type: object
          additionalProperties:
            type: string
        retention_policy:
          type: object
          additionalProperties: true
        compression_settings:
          type: object
          additionalProperties: true
      additionalProperties: false

    # ─── Governance rules ───
    GovernanceRule:
      type: object
      required: [id, name, type, enforcement]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        type:
          type: string
          enum: [access_control, data_usage, rate_limit, audit, compliance, custom]
        description:
          type: string
        enforcement:
          type: string
          enum: [enforce, warn, log]
        conditions:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ─── KPI definition ───
    KPIDefinition:
      type: object
      required: [id, name, metric_type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        metric_type:
          type: string
          enum: [counter, gauge, histogram, timer, boolean]
        unit:
          type: string
        thresholds:
          type: object
          properties:
            warning:
              type: number
            critical:
              type: number
        aggregation_period:
          type: string
          enum: [minute, hour, day, week, month]
        dashboard_link:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Integration definition ───
    IntegrationDefinition:
      type: object
      required: [id, type, config]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [erp, crm, email, calendar, document, messaging, custom]
        name:
          type: string
          maxLength: 200
        provider:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Provider-specific connection configuration
        auth_method:
          type: string
          enum: [oauth2, api_key, basic, jwt, custom]
        status:
          type: string
          enum: [active, inactive, error, pending]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Operational policy ───
    OperationalPolicy:
      type: object
      required: [id, name, scope]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        scope:
          type: string
          enum: [agent, workflow, department, system]
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    # ─── Template ───
    Template:
      type: object
      required: [id, name, category, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        version:
          type: string
          description: Semantic version (semver), e.g. "1.2.3"
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDefinition'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
        memory_topology:
          $ref: '#/components/schemas/MemoryTopology'
        governance_rules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceRule'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KPIDefinition'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDefinition'
        operational_policies:
          type: array
          items:
            $ref: '#/components/schemas/OperationalPolicy'
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, deprecated, published, archived]
        tags:
          type: array
          items:
            type: string
      additionalProperties: false

    TemplateCreate:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDefinition'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
        memory_topology:
          $ref: '#/components/schemas/MemoryTopology'
        governance_rules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceRule'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KPIDefinition'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDefinition'
        operational_policies:
          type: array
          items:
            $ref: '#/components/schemas/OperationalPolicy'
        metadata:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
      additionalProperties: false

    TemplatePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDefinition'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
        memory_topology:
          $ref: '#/components/schemas/MemoryTopology'
        governance_rules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceRule'
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/KPIDefinition'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDefinition'
        operational_policies:
          type: array
          items:
            $ref: '#/components/schemas/OperationalPolicy'
        metadata:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, deprecated, published, archived]
      additionalProperties: false

    # ─── Deployment ───
    TemplateDeployment:
      type: object
      required: [id, template_id, version, status]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [select, configure, connect_data, provision_memory, deploy_swarm, operational, failed, rolled_back]
        environment:
          type: string
          enum: [dev, staging, production]
        configuration:
          type: object
          additionalProperties: true
        provisioned_entities:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        deployed_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false

    TemplateDeployRequest:
      type: object
      required: [version, environment]
      properties:
        version:
          type: string
        environment:
          type: string
          enum: [dev, staging, production]
        configuration:
          type: object
          additionalProperties: true
      additionalProperties: false

    # ─── Custom Template ───
    CustomTemplate:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        content:
          type: object
          additionalProperties: true
          description: Free-form template content for custom templates
        owner_id:
          type: string
          format: uuid
        shared_with:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: string
        status:
          $ref: '#/components/schemas/agentStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
      additionalProperties: false

    CustomTemplateCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        content:
          type: object
          additionalProperties: true
        shared_with:
          type: array
          items:
            type: string
            format: uuid
      additionalProperties: false

    CustomTemplatePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: string
          enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
        content:
          type: object
          additionalProperties: true
        shared_with:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/agentStatus'
      additionalProperties: false

    ServiceRequest:
      type: object
      description: >
        A unit of demand raised against a department service. The work loop
        compiles the service's SOP into a per-request Module 03 workflow,
        stamps the SLA clocks from the service's declared levels, and mirrors
        run state onto this record until it reaches a terminal status.
      additionalProperties: false
      required: [id, tenant_id, department_id, service_id, title, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/uuid' }
        tenant_id: { type: string }
        department_id: { $ref: '#/components/schemas/uuid' }
        service_id: { type: string }
        service_name: { type: string }
        title: { type: string, maxLength: 300 }
        body: { type: string }
        priority: { type: string, description: "P1–P4; drives SLA clock parsing" }
        status:
          type: string
          enum: [submitted, dispatched, in_progress, awaiting_approval, completed, rejected, failed, cancelled]
        requester:
          type: object
          additionalProperties: false
          properties:
            user_id: { type: string }
        sla_response_due: { type: string, format: date-time }
        sla_resolution_due: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        workflow_run_ref:
          type: string
          description: The Module 03 workflow id executing this request.
        gate_node_ids:
          type: array
          items: { type: string }
        tokens_used: { type: integer, minimum: 0 }
        output: { type: string, description: "Final work product, when completed." }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/RequestEvent' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RequestEvent:
      type: object
      description: One entry of a request's audit timeline.
      additionalProperties: false
      required: [at, kind]
      properties:
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [created, dispatched, agent_output, gate_raised, gate_responded, completed, rejected, failed, cancelled, sla_breached, note]
        detail: { type: string }
        node: { type: string, description: "The workflow node the event belongs to (gate pairing key)." }
    Briefing:
      type: object
      description: >
        An operating-cadence digest: scheduled per the department's declared
        rituals, its stats gathered from the request ledger and its prose
        drafted by the department head's agent (stats-only fallback when
        drafting is unavailable).
      additionalProperties: false
      required: [id, tenant_id, department_id, cadence_name, frequency, stats, content, created_at]
      properties:
        id: { $ref: '#/components/schemas/uuid' }
        tenant_id: { type: string }
        department_id: { $ref: '#/components/schemas/uuid' }
        department_name: { type: string }
        cadence_name: { type: string }
        frequency: { type: string, enum: [daily, weekly] }
        stats: { $ref: '#/components/schemas/BriefingStats' }
        content: { type: string }
        model: { type: string, description: "LLM that drafted the content; absent on stats-only fallback." }
        tokens: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    BriefingStats:
      type: object
      additionalProperties: false
      properties:
        open_requests: { type: integer, minimum: 0 }
        awaiting_approval: { type: integer, minimum: 0 }
        completed_last_24h: { type: integer, minimum: 0 }
        failed_last_24h: { type: integer, minimum: 0 }
        sla_breached: { type: integer, minimum: 0 }
        tokens_last_24h: { type: integer, minimum: 0 }
    KPIWindowMetrics:
      type: object
      description: Ledger-derived operational metrics for one time window.
      additionalProperties: false
      required: [requests, completed, failed, tokens_used]
      properties:
        requests: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        completion_rate_pct: { type: integer, minimum: 0, maximum: 100 }
        sla_response_compliance_pct: { type: integer, minimum: 0, maximum: 100 }
        sla_resolution_compliance_pct: { type: integer, minimum: 0, maximum: 100 }
        median_cycle_seconds: { type: integer, minimum: 0 }
        median_gate_turnaround_seconds: { type: integer, minimum: 0 }
        tokens_used: { type: integer, minimum: 0 }
        estimated_cost_usd:
          type: number
          description: tokens_used priced at token_rate_usd_per_million — an estimate, labeled with its rate.
    KPIMeasurementItem:
      type: object
      description: >
        A template KPI definition mapped to the ledger metric that genuinely
        backs it. measured=false with note "no data source yet" is the honest
        answer for KPIs nothing measures yet — values are never invented.
      additionalProperties: false
      required: [kpi_id, name, measured]
      properties:
        kpi_id: { type: string }
        name: { type: string }
        unit: { type: string }
        measured: { type: boolean }
        value: {}
        source: { type: string, description: "e.g. request_ledger:median_cycle_30d" }
        note: { type: string }

  parameters:
    TemplateId:
      name: id
      in: path
      required: true
      description: UUID of the template
      schema:
        type: string
        format: uuid
    CustomTemplateId:
      name: id
      in: path
      required: true
      description: UUID of the custom template
      schema:
        type: string
        format: uuid
    CategoryParam:
      name: category
      in: query
      required: false
      description: Filter by template category
      schema:
        type: string
        enum: [hr, finance, procurement, engineering, translation, legal, compliance, research, custom]
    VersionParam:
      name: version
      in: query
      required: false
      description: Filter by template semantic version
      schema:
        type: string
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-indexed)
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        default: 20
        maximum: 100

paths:
  # ─── Standard Templates ───

  /templates:
    post:
      summary: Create a new department template
      description: Create a new department template with agents, workflows, memory topology, governance rules, KPIs, integrations, and operational policies.
      operationId: createTemplate
      tags:
        - Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List templates
      description: List department templates with optional category and version filters.
      operationId: listTemplates
      tags:
        - Templates
      parameters:
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/VersionParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Templates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}:
    get:
      summary: Get a template
      description: Retrieve a specific department template by ID.
      operationId: getTemplate
      tags:
        - Templates
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update a template
      description: Partially update a department template.
      operationId: updateTemplate
      tags:
        - Templates
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePatch'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a template
      description: Delete a department template. Must not have active deployments.
      operationId: deleteTemplate
      tags:
        - Templates
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Template deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/deploy:
    post:
      summary: Deploy a template
      description: >
        Deploy a template to an environment. Follows the deployment flow:
        select → configure → connect data → provision memory → deploy swarm → operational.
      operationId: deployTemplate
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateDeployRequest'
      responses:
        '201':
          description: Deployment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDeployment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/deployments:
    get:
      summary: List deployments for a template
      description: Retrieve the deployment history for a specific template.
      operationId: listDeployments
      tags:
        - Deployments
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Deployments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateDeployment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Custom Templates ───

  /templates/custom:
    get:
      summary: List custom templates
      description: List custom templates with optional category and version filters.
      operationId: listCustomTemplates
      tags:
        - Custom Templates
      parameters:
        - $ref: '#/components/parameters/CategoryParam'
        - $ref: '#/components/parameters/VersionParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Custom templates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomTemplate'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a custom template
      description: Create a free-form custom department template owned by the authenticated user.
      operationId: createCustomTemplate
      tags:
        - Custom Templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTemplateCreate'
      responses:
        '201':
          description: Custom template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/custom/{id}:
    get:
      summary: Get a custom template
      description: Retrieve a specific custom template by ID.
      operationId: getCustomTemplate
      tags:
        - Custom Templates
      parameters:
        - $ref: '#/components/parameters/CustomTemplateId'
      responses:
        '200':
          description: Custom template retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update a custom template
      description: Partially update a custom template.
      operationId: updateCustomTemplate
      tags:
        - Custom Templates
      parameters:
        - $ref: '#/components/parameters/CustomTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTemplatePatch'
      responses:
        '200':
          description: Custom template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a custom template
      description: Delete a custom template by ID.
      operationId: deleteCustomTemplate
      tags:
        - Custom Templates
      parameters:
        - $ref: '#/components/parameters/CustomTemplateId'
      responses:
        '204':
          description: Custom template deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Template Versioning ───

  /templates/{id}/versions:
    get:
      summary: List template versions
      description: List all versions of a template, ordered by version descending.
      operationId: listTemplateVersions
      tags:
        - Template Versions
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Template versions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                required: [data, meta]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/versions/{version}:
    get:
      summary: Get a specific template version
      description: Retrieve a specific version of a template.
      operationId: getTemplateVersion
      tags:
        - Template Versions
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - name: version
          in: path
          required: true
          description: Semantic version to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Template version retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/{id}/clone:
    post:
      summary: Clone a template
      description: Clone an existing template as a new draft template.
      operationId: cloneTemplate
      tags:
        - Template Operations
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Optional override name for the cloned template
                description:
                  type: string
                  description: Optional override description for the cloned template
      responses:
        '201':
          description: Template cloned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── Standard Error Responses ───

  responses:
    BadRequest:
      description: Bad request — validation failed or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden — insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict — resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable entity — semantic validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  /templates/{id}/validate:
    post:
      summary: Validate a template against the canonical operating-model schema
      description: Runs the same validation the deploy orchestrator runs at the configure stage (schema shape + org-chart integrity — single root, no reports_to cycles, resolvable service/KPI/workflow refs).
      operationId: validateTemplate
      tags:
        - Templates
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /templates/seed:
    post:
      summary: Seed the built-in template catalog into the caller's tenant
      description: Idempotently copies any missing built-in catalog templates (embedded in the service) into the tenant's template store. Also happens lazily on first template list.
      operationId: seedTemplates
      tags:
        - Templates
      responses:
        '200':
          description: Seed result
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /departments:
    get:
      summary: List departments
      description: List deployed department instances for the tenant.
      operationId: listDepartments
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/CategoryParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [provisioning, operational, degraded, suspended, archived]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a department directly (no-template path)
      operationId: createDepartment
      tags:
        - Departments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /departments/{id}:
    get:
      summary: Get a department
      operationId: getDepartment
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a department
      description: Partial update of name, mission, status, business_logic, org_chart, services, value_streams, risks, quality_standards, compliance_controls.
      operationId: patchDepartment
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Archive a department
      description: Sets status to archived and best-effort deactivates the department's Module 04 agents.
      operationId: archiveDepartment
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/org-chart:
    get:
      summary: Get the department org chart
      description: Positions plus reporting/escalation edges and the root position id.
      operationId: getDepartmentOrgChart
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Org chart graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgChart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/services:
    get:
      summary: Get the department service portfolio
      operationId: getDepartmentServices
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Service offerings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/value-chain:
    get:
      summary: Get the department value streams with resolved KPI index
      operationId: getDepartmentValueChain
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Value streams + kpi_index
          content:
            application/json:
              schema:
                type: object
                properties:
                  value_streams:
                    type: array
                    items:
                      type: object
                  kpi_index:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/risks:
    get:
      summary: Get the department risk register
      operationId: getDepartmentRisks
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Risk items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/quality:
    get:
      summary: Get the department quality standards
      operationId: getDepartmentQuality
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Quality standards
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/compliance:
    get:
      summary: Get the department compliance controls grouped by framework
      operationId: getDepartmentCompliance
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Frameworks + controls
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{id}/requests:
    get:
      summary: List the department's service requests (the work ledger)
      operationId: listDepartmentRequests
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: data + meta envelope of ServiceRequest
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Raise a service request — the department's front door
      description: >
        Requires an operational (or degraded) department and a service_id it
        owns. Stamps SLA clocks from the service's declared levels and
        dispatches the work loop, which compiles the service's SOP into a
        per-request Module 03 workflow.
      operationId: createDepartmentRequest
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service_id, title]
              properties:
                service_id: { type: string }
                title: { type: string }
                body: { type: string }
                priority: { type: string }
      responses:
        '201':
          description: The created ServiceRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Department is not operational
  /requests/{id}:
    get:
      summary: Get one service request with its full timeline
      operationId: getRequest
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The ServiceRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /requests/{id}/cancel:
    post:
      summary: Cancel an open request
      operationId: cancelRequest
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The cancelled ServiceRequest
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request already terminal
  /departments/{id}/kpi-measurements:
    get:
      summary: Ledger-derived KPI measurements for the department
      description: >
        7d/30d windows computed server-side from the request ledger, plus the
        template's KPI definitions conservatively mapped to the metric that
        genuinely backs each (measured=false, "no data source yet" otherwise).
      operationId: getDepartmentKpiMeasurements
      tags: [Requests]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Windows + per-KPI measurements
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  department_id: { $ref: '#/components/schemas/uuid' }
                  generated_at: { type: string, format: date-time }
                  token_rate_usd_per_million: { type: number }
                  windows:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/KPIWindowMetrics'
                  kpi_measurements:
                    type: array
                    items:
                      $ref: '#/components/schemas/KPIMeasurementItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /briefings:
    get:
      summary: List the tenant's operating-cadence briefings, newest first
      operationId: listBriefings
      tags: [Briefings]
      parameters:
        - name: department_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: data + meta envelope of Briefing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Briefing'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'


tags:
  - name: Requests
    description: Service requests — the department's front door and work ledger — plus ledger-derived KPI measurements
  - name: Briefings
    description: Operating-cadence digests filed by the scheduler
  - name: Templates
    description: Standard department template CRUD operations
  - name: Departments
    description: Deployed department instances — org chart, services, value chain, risk/quality, compliance
  - name: Deployments
    description: Template deployment lifecycle management
  - name: Custom Templates
    description: Free-form custom template operations
  - name: Template Versions
    description: Template versioning operations
  - name: Template Operations
    description: Template deployment and cloning operations
