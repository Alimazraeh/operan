openapi: "3.0.3"
info:
  title: Operan Capability & Execution API
  description: |
    Module 08 — the doing layer.

    SOPs name business verbs (capabilities), never vendors. Which system
    performs a verb for a tenant is a binding; every execution goes through one
    governed funnel — resolve binding → validate input against the capability
    contract → policy check (Module 10, deny closed) → authority check (the
    acting seat's autonomy tier against the capability's minimum) → dispatch →
    immutable invocation record. Refusals are first-class recorded outcomes.

    Only the simulated provider executes today; it is flagged `simulated` on
    every record it produces, and swapping it for a live provider is a binding
    change, not a code change.

    The legacy tool registry (`/tools*`) remains readable. The legacy echo
    executor is gone: `POST /execute` and `POST /executions/{id}/retry` answer
    410 and point at `/invoke`.
  version: 2.0.0
  contact:
    name: Platform Architecture
    email: arch@operan.io

servers:
  - url: http://tool-execution.operan.svc.cluster.local:8008
    description: In-cluster

security:
  - BearerAuth: []

paths:
  /capabilities:
    get:
      operationId: listCapabilities
      summary: The capability vocabulary
      description: >
        Product-owned and global: tenants differ in bindings, never in verbs.
        Every entry is a permanent contract, added on evidence from the SOP
        catalogue.
      tags: [Capabilities]
      responses:
        "200":
          description: The vocabulary
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/Capability" }

  /providers:
    get:
      operationId: listProviders
      summary: The tenant's providers
      tags: [Providers]
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
    post:
      operationId: createProvider
      summary: Register a provider
      description: >
        Credentials are never accepted inline — a provider carries a
        credential_ref naming a secret held elsewhere. The simulated provider
        needs none.
      tags: [Providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Provider" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /bindings:
    get:
      operationId: listBindings
      summary: The tenant's capability bindings
      tags: [Bindings]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityBinding" }
    post:
      operationId: putBinding
      summary: Create or update a binding
      description: >
        The customer-specific join between a capability and the provider that
        performs it. A department-scoped binding overrides the tenant default.
        `simulated` is derived from the provider's kind, never asserted by the
        caller.
      tags: [Bindings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityBinding" }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityBinding" }
        "422":
          description: Unknown capability or provider

  /invoke:
    post:
      operationId: invokeCapability
      summary: Perform a capability through the governed funnel
      description: >
        The single door. A refusal — blocked_no_binding, invalid_input,
        denied_policy, denied_authority — is a recorded outcome returned with
        200, not a transport error: the invocation states which stage stopped
        it and why. 422 is reserved for requests malformed before anything
        could be recorded (unknown capability, missing tenant).
      tags: [Execution]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeRequest" }
      responses:
        "200":
          description: The recorded invocation, completed or refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invocation" }
        "422":
          description: Malformed before recording

  /invocations:
    get:
      operationId: listInvocations
      summary: The immutable invocation trail
      tags: [Execution]
      parameters:
        - { name: capability_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Invocations, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  invocations:
                    type: array
                    items: { $ref: "#/components/schemas/Invocation" }
                  total: { type: integer }

  /execute:
    post:
      deprecated: true
      operationId: executeToolGone
      summary: "Removed: the echo executor"
      description: >
        Answers 410. The in-process executor echoed its input back as output
        and stamped records completed; capabilities are performed via /invoke.
      tags: [Legacy]
      responses:
        "410": { description: Gone — use POST /invoke }

  /tools:
    get:
      operationId: listTools
      summary: Legacy tool registry (read)
      deprecated: true
      tags: [Legacy]
      responses:
        "200": { description: Registered tool definitions }

  /executions:
    get:
      operationId: listLegacyExecutions
      summary: Legacy execution records (read)
      deprecated: true
      tags: [Legacy]
      responses:
        "200": { description: Records produced before the funnel existed }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
  schemas:
    Capability:
      type: object
      required: [id, domain, name, side_effect, min_autonomy, input_schema]
      properties:
        id: { type: string, example: itsm.ticket.assign }
        domain: { type: string, enum: [itsm, identity, itops, comms] }
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          description: JSON Schema. Enforced — invalid input never reaches a provider.
        output_schema: { type: object }
        side_effect: { type: string, enum: [read, write, destructive] }
        min_autonomy:
          type: string
          enum: [recommend, draft, execute, coordinate]
          description: Least autonomy tier the acting seat must hold.

    Provider:
      type: object
      required: [kind, name]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, readOnly: true }
        kind: { type: string, enum: [simulated, mcp, native, http] }
        name: { type: string }
        endpoint: { type: string }
        credential_ref:
          type: string
          description: Names a secret held elsewhere. Never a secret itself.
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    CapabilityBinding:
      type: object
      required: [capability_id, provider_id]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, readOnly: true }
        department_id:
          type: string
          description: Empty = tenant default; set = overrides it for that department.
        capability_id: { type: string }
        provider_id: { type: string }
        provider_tool: { type: string, description: Defaults to the capability id. }
        enabled: { type: boolean }
        simulated: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    Actor:
      type: object
      properties:
        type: { type: string, enum: [agent, user, system] }
        id: { type: string }
        position_id: { type: string }
        autonomy_tier:
          type: string
          description: >
            The acting seat's tier. Unknown ranks below every tier — unknown
            authority is not authority.

    Correlation:
      type: object
      properties:
        request_id: { type: string }
        workflow_id: { type: string }
        node_id: { type: string }
        department_id: { type: string }

    ExternalRef:
      type: object
      required: [system, kind, id]
      description: >
        The canonical pointer to whatever the provider touched — the only
        vendor data Operan canonicalizes. Payloads stay opaque.
      properties:
        system: { type: string }
        kind: { type: string }
        id: { type: string }
        url: { type: string }

    InvokeRequest:
      type: object
      required: [capability_id, input]
      properties:
        capability_id: { type: string }
        input: { type: object }
        actor: { $ref: "#/components/schemas/Actor" }
        correlation: { $ref: "#/components/schemas/Correlation" }

    Invocation:
      type: object
      required: [id, tenant_id, capability_id, status, simulated, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        capability_id: { type: string }
        side_effect: { type: string }
        provider_id: { type: string }
        provider_kind: { type: string }
        provider_tool: { type: string }
        actor: { $ref: "#/components/schemas/Actor" }
        correlation: { $ref: "#/components/schemas/Correlation" }
        input: { type: object }
        output: { type: object }
        external_ref: { $ref: "#/components/schemas/ExternalRef" }
        simulated:
          type: boolean
          description: True whenever the performing provider is simulated. Never hidden.
        policy_decision: { type: string }
        status:
          type: string
          enum: [completed, blocked_no_binding, invalid_input, denied_policy, denied_authority, failed]
        error: { type: string }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }
