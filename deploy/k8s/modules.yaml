apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-control-plane
  namespace: operan
  labels:
    app.kubernetes.io/name: tenant-control-plane
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-control-plane
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: tenant-control-plane
        image: alimazraeh/operan-01-tenant-control-plane:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: EVENT_BUS_HOST
          value: kafka.operan.svc.cluster.local
        - name: EVENT_BUS_PORT
          value: '9092'
        - name: EVENT_BUS_PROTO
          value: kafka
        # PostgreSQL persistence for tenant, subscription, secret, and
        # deployment state. Without this the control plane loses everything
        # on pod restart. DSN from the operan-postgresql ConfigMap (shared
        # with M03/M04/M08).
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: operan-postgresql
              key: DSN
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-control-plane
  namespace: operan
  labels:
    app.kubernetes.io/name: tenant-control-plane
    app.kubernetes.io/part-of: operan
spec:
  selector:
    app.kubernetes.io/name: tenant-control-plane
  ports:
  - port: 8080
    targetPort: 8080
