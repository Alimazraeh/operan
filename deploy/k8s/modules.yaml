apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestration
  namespace: operan
  labels:
    app.kubernetes.io/name: agent-orchestration
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-orchestration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-orchestration
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: agent-orchestration
        image: alimazraeh/operan-03-agent-orchestration:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: EVENT_BUS_HOST
          value: kafka.operan.svc.cluster.local
        - name: EVENT_BUS_PORT
          value: '9092'
        - name: EVENT_BUS_PROTO
          value: kafka
        - name: LLM_BASE_URL
          value: http://litellm.deep-research.svc.cluster.local:4000
        - name: LLM_MODEL
          value: Qwen/Qwen3.6-35B-A3B
        - name: MEMORY_URL
          value: http://memory-fabric.operan.svc.cluster.local:8007
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: operan-litellm
              key: api-key
        # PostgreSQL persistence for workflow state. Without DB_MODE=postgres
        # the engine keeps everything in memory and loses every workflow on
        # pod restart. Point at the shared instance in postgresql.yaml
        # (service `postgresql` in the operan namespace).
        - name: DB_MODE
          value: postgres
        - name: DB_HOST
          value: postgresql.operan.svc.cluster.local
        - name: DB_PORT
          value: '5432'
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: operan-postgresql
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: operan-postgresql
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          value: orchestration
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
---
