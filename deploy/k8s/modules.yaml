apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-execution
  namespace: operan
  labels:
    app.kubernetes.io/name: tool-execution
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-execution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-execution
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: tool-execution
        image: alimazraeh/operan-08-tool-execution:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8008
        env:
        - name: MODULE08_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: MODULE08_EVENT_BROKER_URL
          value: kafka.operan.svc.cluster.local:9092
        # The capability layer: bindings are customer configuration and
        # invocations are the audit trail — durable, or the service refuses to
        # start. DSN from the operan-postgresql ConfigMap (shared with M03/M04).
        - name: MODULE08_DB_URL
          valueFrom:
            configMapKeyRef:
              name: operan-postgresql
              key: DSN
        - name: MODULE08_POLICY_URL
          value: http://policy-governance.operan.svc.cluster.local:8010
        # Demo bootstrap: these tenants get the simulated provider bound to
        # every capability, idempotently, at boot.
        - name: MODULE08_SEED_SIMULATED_TENANTS
          value: smoke-tenant
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
---
