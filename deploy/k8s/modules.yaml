apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-templates
  namespace: operan
  labels:
    app.kubernetes.io/name: department-templates
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: department-templates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: department-templates
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: department-templates
        # Sha-pinned to match the cluster's current rollout. Update this
        # sha when deploying a new M05 build. Do NOT use :latest — the
        # cluster is managed via sha-pinned rollouts and :latest would
        # un-pin the cluster to whatever was last pushed to the registry.
        image: alimazraeh/operan-05-department-template-engine:sha-bcce0d9
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        env:
        - name: MODULE05_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: MODULE05_EVENT_BROKER_URL
          value: kafka.operan.svc.cluster.local:9092
        - name: MODULE05_REGISTRY_URL
          value: http://agent-registry.operan.svc.cluster.local:8083
        - name: MODULE05_MEMORY_URL
          value: http://memory-fabric.operan.svc.cluster.local:8007
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: m05-template-data
---
