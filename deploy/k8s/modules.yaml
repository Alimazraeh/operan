apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-registry
  namespace: operan
  labels:
    app.kubernetes.io/name: agent-registry
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-registry
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: agent-registry
        image: alimazraeh/operan-04-agent-registry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        env:
        - name: AGENT_REGISTRY_PORT
          value: :8083
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: EVENT_BUS_HOST
          value: kafka.operan.svc.cluster.local
        - name: EVENT_BUS_PORT
          value: '9092'
        - name: EVENT_BUS_PROTO
          value: kafka
        - name: DB_PASSWORD
          value: demo-in-memory-stores-no-db
        # Without this the registry runs in memory and loses every registered
        # agent on restart — which it had done 24 times, leaving the portal
        # reading "0 Agents" and org-chart positions pointing at agent_ids that
        # no longer resolved. With it set but unreachable the service refuses to
        # start rather than looking healthy while forgetting everything.
        #
        # DSN built from the operan-postgresql ConfigMap (shared with M03 and
        # the PostgreSQL StatefulSet). The password is cluster-internal; for
        # production, replace with a Secret and TLS.
        - name: AGENT_REGISTRY_DATABASE_DSN
          valueFrom:
            configMapKeyRef:
              name: operan-postgresql
              key: DSN
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
---
