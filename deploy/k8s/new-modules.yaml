# Operan — New Modules Deployment Manifests
# Dependencies: Kafka + PostgreSQL must exist in operan namespace
# Apply after existing modules.yaml: kubectl apply -f deploy/k8s/new-modules.yaml -n operan
---
# ─── M12 — Model Abstraction (port 8012) ───
# Foundation module — no internal deps, depends on Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-abstraction
  namespace: operan
  labels:
    app.kubernetes.io/name: model-abstraction
    app.kubernetes.io/part-of: operan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-abstraction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-abstraction
        app.kubernetes.io/part-of: operan
    spec:
      enableServiceLinks: false
      containers:
      - name: model-abstraction
        image: alimazraeh/operan-12-model-abstraction:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8012
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: operan-jwt
              key: secret
        - name: EVENT_BROKER_URL
          value: kafka.operan.svc.cluster.local:9092
        - name: DB_DSN
          value: postgres://operan:CHANGE_ME@postgresql.operan.svc.cluster.local:5432/operan?sslmode=disable
        readinessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8012
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: model-abstraction
  namespace: operan
spec:
  selector:
    app.kubernetes.io/name: model-abstraction
  ports:
  - port: 8012
    targetPort: 8012
---
