          requests: { cpu: 200m, memory: 256Mi }
          limits: { memory: 1Gi }
        readinessProbe:
          httpGet:
            path: /health
            port: 8016
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
