replicaCount: 1

image:
  repository: registry.operan.dev/execution-sandbox
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8016

env:
  HTTP_PORT: "8016"
  JWT_SECRET: ""
  DB_DSN: ""
  M10_BASE_URL: "http://policy-governance:8010"
  EVENT_BROKER_URL: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: sandbox.operan.local
      paths:
        - path: /
          pathType: Prefix