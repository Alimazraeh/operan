replicaCount: 1

image:
  repository: registry.operan.dev/knowledge-ingestion
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8006

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: knowledge-ingestion.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8006
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8006
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

env:
  IAM_TOKEN_SECRET: ""
  EVENT_BROKER_URL: ""
  DB_DSN: ""
  M12_BASE_URL: ""
  M07_BASE_URL: ""
  M19_BASE_URL: ""
  PROVIDER_API_KEYS: '[]'

nodeSelector: {}
tolerations: []
affinity: {}