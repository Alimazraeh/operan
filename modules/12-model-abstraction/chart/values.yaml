replicaCount: 1

image:
  repository: registry.operan.dev/model-abstraction
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8012

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: model-abstraction.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

volumes: []
volumeMounts: []

livenessProbe:
  httpGet:
    path: /health
    port: 8012
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8012
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Environment configuration
env:
  IAM_TOKEN_SECRET: ""
  EVENT_BROKER_URL: ""
  DB_DSN: ""
  # PROVIDER_API_KEYS is a JSON array: [{"name":"openai","key":"sk-..."}]
  PROVIDER_API_KEYS: '[]'

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}