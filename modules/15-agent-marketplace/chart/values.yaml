replicaCount: 1

image:
  repository: registry.operan.dev/agent-marketplace
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8015

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agent-marketplace.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8015
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8015
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Environment configuration
env:
  JWT_SECRET: ""
  EVENT_BROKER_URL: ""
  DB_DSN: ""
  M04_BASE_URL: "http://agent-registry:8004"
  M03_BASE_URL: "http://agent-orchestration:8003"
  M12_BASE_URL: "http://model-abstraction:8012"

nodeSelector: {}
tolerations: []
affinity: {}