apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "policy-governance.fullname" . }}
  labels:
    {{- include "policy-governance.labels" . | nindent 4 }}
data:
  HTTP_PORT: "8010"
  ISSUER: "operan-tenant-control-plane"
  DB_DSN: {{ .Values.config.dbDsn | quote }}
  EVENT_BROKER_URL: {{ .Values.config.eventBrokerURL | quote }}
  M04_BASE_URL: {{ .Values.config.m04BaseURL | quote }}