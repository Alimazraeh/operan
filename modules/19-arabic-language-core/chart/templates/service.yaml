{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arabic-language-core.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "arabic-language-core.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/module: m19
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "arabic-language-core.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}