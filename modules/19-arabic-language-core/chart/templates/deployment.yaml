{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arabic-language-core.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "arabic-language-core.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/module: m19
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "arabic-language-core.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "arabic-language-core.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8019
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "{{ .Values.service.port }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "arabic-language-core.fullname" . }}-secrets
                  key: jwt-secret
            - name: M12_BASE_URL
              value: {{ .Values.m12BaseUrl | quote }}
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "arabic-language-core.fullname" . }}-secrets
                  key: db-dsn
            - name: EVENT_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arabic-language-core.fullname" . }}-secrets
                  key: event-broker-url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}